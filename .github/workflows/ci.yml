# Adicionar como .github/workflows/ci.yml no relatorio-ipca (OPCIONAL)
# Renderiza o Quarto a cada PR/push. Pode exigir instalar pacotes R
# usados pelo .qmd (adicione um passo de setup conforme necessario).
name: CI (Quarto render)

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
  pull_request:
    paths-ignore:
      - "output/**"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render
        run: quarto render
