# Substituir o .github/workflows/ci.yml do relatorio-ipca por este.
# Renderiza o relatorio Quarto em cada PR/push, instalando os pacotes R
# usados pela camada R/ (mesma receita do workflow semanal ja existente).
name: CI (Quarto render)

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "logs/**"
  pull_request:
    paths-ignore:
      - "output/**"
      - "logs/**"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true   # pacotes como binarios (rapido, sem compilar)

      - name: Instala pacotes R
        run: |
          Rscript -e "pkgs <- c('rbcb','sidrar','dplyr','tidyr','lubridate','slider','ggplot2','scales','knitr','rmarkdown','kableExtra'); install.packages(pkgs); faltando <- setdiff(pkgs, rownames(installed.packages())); if (length(faltando) > 0) stop('Pacotes NAO instalados: ', paste(faltando, collapse=', '))"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render
