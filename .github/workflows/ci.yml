# Substituir o .github/workflows/ci.yml do relatorio-ipca por este.
# Renderiza o relatorio Quarto em cada PR/push, instalando os pacotes R
# usados pela camada R/ (mesma receita do workflow semanal ja existente).
name: CI (Quarto render)

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "logs/**"
  pull_request:
    paths-ignore:
      - "output/**"
      - "logs/**"

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true   # pacotes como binarios (rapido, sem compilar)

      - name: Instala pacotes R
        run: |
          Rscript -e "pkgs <- c('rbcb','sidrar','dplyr','tidyr','lubridate','slider','ggplot2','scales','knitr','rmarkdown','kableExtra','ggiraph','testthat'); install.packages(pkgs); faltando <- setdiff(pkgs, rownames(installed.packages())); if (length(faltando) > 0) stop('Pacotes NAO instalados: ', paste(faltando, collapse=', '))"

      - uses: quarto-dev/quarto-actions/setup@v2

      # Testes primeiro: falha de cálculo aparece em segundos, enquanto o
      # render completo consulta as APIs do BCB e do SIDRA e leva minutos.
      - name: Testes das funções de tratamento
        working-directory: tests
        run: Rscript testthat.R

      - name: Render
        run: quarto render

      # O render consulta as APIs em tempo real: se uma fonte estiver fora do
      # ar, o HTML sai com "indisponível" em vez de falhar. Este passo torna
      # isso visível no log do CI em vez de deixar passar calado.
      - name: Verifica se o relatório saiu com indicadores ausentes
        run: |
          if grep -q "indisponível" relatorio_ipca.html; then
            echo "::warning::O relatório renderizou com ao menos um indicador indisponível."
          fi
