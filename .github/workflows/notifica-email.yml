name: Notifica publicação do relatório IPCA

on:
  push:
    branches: [main]

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Envia e-mail de notificação
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Relatório IPCA atualizado — ${{ github.event.head_commit.message }}"
          to: jmagomez@gmail.com
          from: "Relatório IPCA <jmagomez@gmail.com>"
          html_body: |
            <p>O relatório IPCA foi atualizado e publicado no Connect Cloud.</p>
            <p><a href="https://connect.posit.cloud/jmagomez/content/019f5da4-43ea-2bed-6bbd-90e3f7aaca72">Abrir relatório</a></p>
            <p><small>Commit: ${{ github.event.head_commit.message }} (${{ github.sha }})</small></p>
