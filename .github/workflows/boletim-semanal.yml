name: Boletim Macro Semanal

on:
  schedule:
    - cron: "0 10 * * 1"   # toda segunda 07h BRT (UTC-3)
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Data de referência (YYYY-MM-DD, vazio = hoje)"
        default: ""

permissions:
  contents: write

# Locale UTF-8 explícito. Em locale C (padrão de vários runners), o R lê os
# fontes como latin1 e publica "Ritmo da infla....o" no lugar de "Ritmo da
# inflação", além de rotular os eixos com meses em inglês. Verificado: o mesmo
# gráfico sai correto com LANG=C.UTF-8 e corrompido sem.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  gerar-boletim:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # token com escrita necessário para o git push funcionar
          token: ${{ secrets.GITHUB_TOKEN }}

      # Falha cedo e com mensagem clara se o secret não estiver configurado,
      # em vez de quebrar de forma obscura dentro do passo "Gera boletim".
      - name: Verifica secret ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY ausente. Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configura identidade git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true   # instala pacotes como binários (rápido, sem compilar)

      # Instala todos os pacotes usados pela camada R/ do projeto, via
      # binários do RSPM, e falha imediatamente se algum não instalar.
      - name: Instala pacotes R
        run: |
          Rscript -e "pkgs <- c('rbcb','sidrar','dplyr','tidyr','lubridate','slider','ggplot2','scales','knitr','rmarkdown','kableExtra','ggiraph','testthat'); install.packages(pkgs); faltando <- setdiff(pkgs, rownames(installed.packages())); if (length(faltando) > 0) stop('Pacotes NAO instalados: ', paste(faltando, collapse=', '))"

      - uses: quarto-dev/quarto-actions/setup@v2

      # As funções puras de tratamento são a base de todo número publicado.
      # Rodar os testes antes de gerar o boletim impede que uma regressão de
      # cálculo chegue ao e-mail.
      - name: Testes das funções de tratamento
        working-directory: tests
        run: Rscript testthat.R

      - name: Instala Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Gera boletim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/gerar-boletim ${{ inputs.data_ref }}" \
            --dangerously-skip-permissions

      # O publicador já faz git add + git commit; aqui apenas publicamos.
      # Só faz push se houver commit novo, evitando erro quando a rotina
      # para antes de commitar (ex.: revisor não aprovou).
      - name: Push
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${GITHUB_REF_NAME} 2>/dev/null || echo none)" ]; then
            git push
            echo "publicado=true" >> "$GITHUB_OUTPUT"
            echo "commit_msg=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum commit novo — push ignorado."
            echo "publicado=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()   # salva logs mesmo se o job falhar
        with:
          name: logs-${{ github.run_id }}
          path: |
            logs/
          if-no-files-found: ignore   # ausência de logs/ não gera erro nem warning

      # Os dois passos abaixo só rodam quando um boletim NOVO foi publicado.
      # Sem essa condição, uma execução em que o revisor não aprovou (push
      # ignorado) enviaria por e-mail o boletim.html ANTIGO como se fosse novo.
      # `sed` substituiria a PRIMEIRA ocorrência de "</body>" em cada linha, e
      # só casaria a grafia exata em minúsculas. Um HTML com </BODY> ou com a
      # string dentro de um script sairia com o rodapé no lugar errado — ou sem
      # rodapé nenhum, silenciosamente. Aqui a âncora é a ÚLTIMA ocorrência,
      # sem diferenciar maiúsculas, e a ausência dela é erro.
      - name: Insere link do Connect Cloud no corpo do e-mail
        if: success() && steps.push.outputs.publicado == 'true'
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          RODAPE = (
              '<hr><p><a href="https://connect.posit.cloud/jmagomez/content/'
              '019f5da4-43ea-2bed-6bbd-90e3f7aaca72">'
              '📈 Abrir a versão interativa no Connect Cloud</a></p>'
          )
          html = Path("boletim.html").read_text(encoding="utf-8")
          casos = list(re.finditer(r"</body\s*>", html, flags=re.IGNORECASE))
          if not casos:
              sys.exit("boletim.html não tem </body> — render provavelmente falhou.")
          fim = casos[-1].start()
          Path("corpo-email.html").write_text(
              html[:fim] + RODAPE + html[fim:], encoding="utf-8"
          )
          print("corpo-email.html gerado")
          PY

      - name: Envia boletim por e-mail
        if: success() && steps.push.outputs.publicado == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Boletim Macro <${{ secrets.MAIL_USERNAME }}>
          to: jmagomez@gmail.com
          subject: "📊 Boletim Macro Semanal — ${{ inputs.data_ref || 'edição da semana' }}"
          html_body: file://corpo-email.html
          attachments: boletim.html

      - name: Envia report por e-mail
        if: always()   # envia tanto em sucesso quanto em falha
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Boletim Macro <${{ secrets.MAIL_USERNAME }}>
          to: jmagomez@gmail.com
          subject: "Boletim Macro Semanal — ${{ job.status }} (run ${{ github.run_number }})"
          body: |
            Execução do workflow Boletim Macro Semanal.

            Status: ${{ job.status }}
            Data/ref: ${{ inputs.data_ref || 'automática (hoje)' }}
            Boletim novo publicado: ${{ steps.push.outputs.publicado || 'não chegou ao push' }}
            Disparo: ${{ github.event_name }}
            Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
